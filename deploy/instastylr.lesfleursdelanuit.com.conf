# Instastylr — static site served directly by nginx (no app server).
# This is the HTTP (:80) block; certbot --nginx adds the :443 block + redirect,
# mirroring the existing lesfleursdelanuit.com config.
server {
    listen 80;
    listen [::]:80;
    server_name instastylr.lesfleursdelanuit.com;

    root /var/www/instastylr;
    index index.html;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page entry; fall back to index.html for any other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
